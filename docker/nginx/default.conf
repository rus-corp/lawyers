# Connections to the Next.js server are kept open and reused instead of opening one per request.
# They are closed after 4 s of quiet, before Node's own 5 s limit, so nginx never sends a request
# into a connection the server is closing.
upstream next_app {
  server web:3000;
  keepalive 16;
  keepalive_timeout 4s;
}

# Upgrade requests pass the header on; for all others the Connection header is cleared,
# which keeps the upstream connection open.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' '';
}

server {
  listen 443 ssl;
  http2 on;
  server_name pravo-dok.ru;
  ssl_certificate /etc/letsencrypt/live/pravo-dok.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pravo-dok.ru/privkey.pem;
  client_max_body_size 10M;

  location / {
    proxy_pass http://next_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /admin/ {
    client_max_body_size 10M;
    proxy_pass http://api:8000/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /static/ {
    alias /app/static/;
  }

  location /media/ {
    alias /app/media/;
  }

  location /_next/ {
    proxy_pass http://next_app;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
  }

  location ~ /\.env {
    deny all;
  }
}

# The site lives on one host: www goes to the bare domain.
server {
  listen 443 ssl;
  http2 on;
  server_name www.pravo-dok.ru;
  ssl_certificate /etc/letsencrypt/live/pravo-dok.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pravo-dok.ru/privkey.pem;

  return 301 https://pravo-dok.ru$request_uri;
}

server {
  listen 80;
  server_name pravo-dok.ru www.pravo-dok.ru;
  client_max_body_size 10M;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://pravo-dok.ru$request_uri;
  }

  location ~ /\.env {
    deny all;
  }
}